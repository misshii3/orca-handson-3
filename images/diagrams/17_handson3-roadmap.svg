<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 304" width="880" height="304" role="img" aria-labelledby="title desc">
  <title id="title">第3弾の道のり</title>
  <desc id="desc">1 行のタイムライン。準備（約 20 分）は 1 前提チェック、2 リポ複製と Issue を作り崩れた画面を見る、3 プロジェクト追加と Yolo。本編（約 80 分）は 4 ワークツリー 2 本と dev サーバー、5 ブラウザで開く、6 Design Mode で 1 か所目、7 まとめて 2 か所、8 スマホ幅の崩れ、9 #1 を PR → マージ、10 Codex の #2 を確認 → PR → マージ、11 後片付けと手動に戻す。付録（任意）は A Codex と比べる、B エージェントにブラウザ操作、C プロファイルとビューポート、D トラブル対処、E 業務での判断基準。1〜11 章の下にはチェックポイントの印がある。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#57606A"/>
    </marker>
    <!-- チェックポイントの印 -->
    <g id="check">
      <circle r="7" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.25"/>
      <path d="M-3.5 0.5l2.5 2.5l4.5-5" fill="none" stroke="#1A7F37" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <!-- 背景カード -->
  <rect x="0.5" y="0.5" width="879" height="303" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" fill="#1F2328" font-size="13">
    <text x="24" y="40" font-size="20" font-weight="700">第3弾の道のり</text>
    <text x="856" y="40" text-anchor="end" font-size="12" fill="#57606A">所要時間は目安。付録は必要なときだけ読む</text>

    <!-- グループ（ブラケットと見出し） -->
    <g fill="none" stroke="#57606A" stroke-width="1.25">
      <path d="M47 108v-6h126v6"/>
      <path d="M197 108v-6h376v6"/>
      <path d="M597 108v-6h226v6"/>
    </g>
    <g font-weight="600" text-anchor="middle">
      <text x="110" y="92">準備（約 20 分）</text>
      <text x="385" y="92">本編（約 80 分）</text>
      <text x="710" y="92">付録（任意）</text>
    </g>

    <!-- タイムライン -->
    <line x1="60" y1="126" x2="836" y2="126" stroke="#57606A" stroke-width="1.75" marker-end="url(#arrow)"/>

    <!-- ノード -->
    <g stroke="#1F2328" stroke-width="1.5" fill="#FFFFFF">
      <circle cx="60" cy="126" r="13"/><circle cx="110" cy="126" r="13"/><circle cx="160" cy="126" r="13"/>
      <circle cx="210" cy="126" r="13"/><circle cx="260" cy="126" r="13"/><circle cx="310" cy="126" r="13"/><circle cx="360" cy="126" r="13"/>
      <circle cx="410" cy="126" r="13"/><circle cx="460" cy="126" r="13"/><circle cx="510" cy="126" r="13"/><circle cx="560" cy="126" r="13"/>
      <circle cx="610" cy="126" r="13"/><circle cx="660" cy="126" r="13"/><circle cx="710" cy="126" r="13"/><circle cx="760" cy="126" r="13"/><circle cx="810" cy="126" r="13"/>
    </g>
    <g font-size="12" font-weight="700" text-anchor="middle">
      <text x="60" y="130.5">1</text><text x="110" y="130.5">2</text><text x="160" y="130.5">3</text>
      <text x="210" y="130.5">4</text><text x="260" y="130.5">5</text><text x="310" y="130.5">6</text><text x="360" y="130.5">7</text>
      <text x="410" y="130.5">8</text><text x="460" y="130.5">9</text><text x="510" y="130.5">10</text><text x="560" y="130.5">11</text>
      <text x="610" y="130.5">A</text><text x="660" y="130.5">B</text><text x="710" y="130.5">C</text><text x="760" y="130.5">D</text><text x="810" y="130.5">E</text>
    </g>

    <!-- チェックポイント（1〜11 章） -->
    <use href="#check" x="60" y="158"/><use href="#check" x="110" y="158"/><use href="#check" x="160" y="158"/>
    <use href="#check" x="210" y="158"/><use href="#check" x="260" y="158"/><use href="#check" x="310" y="158"/><use href="#check" x="360" y="158"/>
    <use href="#check" x="410" y="158"/><use href="#check" x="460" y="158"/><use href="#check" x="510" y="158"/><use href="#check" x="560" y="158"/>

    <!-- 章名までのリーダー線 -->
    <g stroke="#D0D7DE" stroke-dasharray="2 2">
      <line x1="60" y1="167" x2="60" y2="176"/><line x1="160" y1="167" x2="160" y2="176"/><line x1="260" y1="167" x2="260" y2="176"/>
      <line x1="360" y1="167" x2="360" y2="176"/><line x1="460" y1="167" x2="460" y2="176"/><line x1="560" y1="167" x2="560" y2="176"/>
      <line x1="660" y1="141" x2="660" y2="176"/><line x1="760" y1="141" x2="760" y2="176"/>
      <line x1="110" y1="167" x2="110" y2="206"/><line x1="210" y1="167" x2="210" y2="206"/><line x1="310" y1="167" x2="310" y2="206"/>
      <line x1="410" y1="167" x2="410" y2="206"/><line x1="510" y1="167" x2="510" y2="206"/>
      <line x1="610" y1="141" x2="610" y2="206"/><line x1="710" y1="141" x2="710" y2="206"/><line x1="810" y1="141" x2="810" y2="206"/>
    </g>

    <!-- 章名（上段: 1, 3, 5, 7, 9, 11, B, D。下段: 2, 4, 6, 8, 10, A, C, E） -->
    <g font-size="11" text-anchor="middle">
      <text x="60" y="188">1 前提チェック</text>
      <text x="160" y="188">3 プロジェクト<tspan x="160" dy="1.4em">追加と Yolo</tspan></text>
      <text x="260" y="188">5 ブラウザで開く</text>
      <text x="360" y="188">7 まとめて<tspan x="360" dy="1.4em">2 か所</tspan></text>
      <text x="460" y="188">9 #1 を PR →<tspan x="460" dy="1.4em">マージ</tspan></text>
      <text x="560" y="188">11 後片付けと<tspan x="560" dy="1.4em">手動に戻す</tspan></text>
      <text x="660" y="188">B エージェントに<tspan x="660" dy="1.4em">ブラウザ操作</tspan></text>
      <text x="760" y="188">D トラブル対処</text>
      <text x="110" y="218">2 リポ複製と<tspan x="110" dy="1.4em">Issue を作り、</tspan><tspan x="110" dy="1.4em">崩れた画面を見る</tspan></text>
      <text x="210" y="218">4 ワークツリー<tspan x="210" dy="1.4em">2 本と</tspan><tspan x="210" dy="1.4em">dev サーバー</tspan></text>
      <text x="310" y="218">6 Design Mode<tspan x="310" dy="1.4em">で 1 か所目</tspan></text>
      <text x="410" y="218">8 スマホ幅の<tspan x="410" dy="1.4em">崩れ</tspan></text>
      <text x="510" y="218">10 Codex の #2<tspan x="510" dy="1.4em">確認 → PR →</tspan><tspan x="510" dy="1.4em">マージ</tspan></text>
      <text x="610" y="218">A Codex と<tspan x="610" dy="1.4em">比べる</tspan></text>
      <text x="710" y="218">C プロファイルと<tspan x="710" dy="1.4em">ビューポート</tspan></text>
      <text x="810" y="218">E 業務での<tspan x="810" dy="1.4em">判断基準</tspan></text>
    </g>

    <!-- 凡例 -->
    <use href="#check" x="40" y="274"/>
    <text x="54" y="278" font-size="12" fill="#57606A">＝ 章末のチェックポイント（できたか確認してから次へ進む）</text>
  </g>
</svg>
