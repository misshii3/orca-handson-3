<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 448" width="880" height="448" role="img" aria-labelledby="t d">
  <title id="t">dev サーバーとブラウザの構成</title>
  <desc id="d">「1 台の Mac」と書いた外枠の中に、2 本のワークツリーのカードを左右に並べる。左はワークツリー #1（Claude Code）。中に 4 つの部品がある。上に dev サーバー（npm run dev → http://localhost:3000）、中段左にファイル（public/style.css、app.js）、中段右にブラウザタブ（Orca 内の Chromium、3000 番を表示）、下に Claude Code。矢印は 4 本で 1 周する。ファイルから dev サーバーへ「fs.watch で変更を検知」、dev サーバーからブラウザへ「配信 + 再読み込みを通知」、ブラウザから Claude Code へ「注釈を送信」、Claude Code からファイルへ「ファイルを編集」。右はワークツリー #2（Codex）で、同じ構成。dev サーバーは PORT=3001 npm run dev → http://localhost:3001、ブラウザタブは 3001 番を表示、エージェントは Codex。2 つのカードの間の注記: ポートを分けるので 2 つとも同時に動く。ワークツリーは別フォルダなので、それぞれの dev サーバーは自分のフォルダにあるファイルを配信する。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; fill: #1F2328; }
      .title { font-size: 20px; font-weight: bold; }
      .head { font-size: 15px; font-weight: 600; }
      .body { font-size: 13px; }
      .b600 { font-size: 13px; font-weight: 600; }
      .cap { font-size: 12px; fill: #57606A; }
      .cap11 { font-size: 11px; fill: #57606A; }
      .mono12 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .mono11 { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
      .mid { text-anchor: middle; }
      .end { text-anchor: end; }
      .band { fill: #F6F8FA; stroke: #D0D7DE; stroke-width: 1; }
      .node { fill: #F6F8FA; stroke: #D0D7DE; stroke-width: 1.5; }
      .node-browser { fill: #DDF4FF; stroke: #0969DA; stroke-width: 1.5; }
      .node-claude { fill: #FFF1E5; stroke: #D97757; stroke-width: 1.5; }
      .node-codex { fill: #DDF4FF; stroke: #0969DA; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #57606A; stroke-width: 1.75; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- 背景カード -->
  <rect x="0.5" y="0.5" width="879" height="447" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>

  <!-- タイトル -->
  <text x="24" y="40" class="title">構成: 2 本のワークツリーと 2 つの dev サーバーを 1 台の Mac で動かす</text>
  <text x="24" y="62" class="cap">ワークツリーごとに dev サーバー・ブラウザタブ・エージェントが 1 組。図 14 のループがそれぞれ独立して回る</text>

  <!-- 外枠: 1 台の Mac -->
  <rect x="24" y="76" width="832" height="348" rx="12" class="band"/>
  <text x="40" y="98" class="b600">1 台の Mac</text>
  <text x="120" y="98" class="cap">ポート 3000 と 3001 を同時に使う</text>

  <!-- ===== 左: ワークツリー #1（Claude Code） ===== -->
  <rect x="40" y="108" width="328" height="300" rx="12" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
  <text x="56" y="133" class="head" fill="#9A4A2B">ワークツリー #1（Claude Code）</text>

  <!-- dev サーバー -->
  <rect x="56" y="148" width="296" height="48" rx="8" class="node"/>
  <text x="68" y="167" class="b600">dev サーバー <tspan class="mono12" font-weight="400" fill="#57606A">npm run dev</tspan></text>
  <text x="68" y="186" class="mono12">→ http://localhost:3000</text>

  <!-- ファイル → dev サーバー（上向き）、dev サーバー → ブラウザ（下向き） -->
  <path d="M80,252 V196" class="arrow"/>
  <text x="88" y="220" class="cap11"><tspan class="mono11">fs.watch</tspan> で</text>
  <text x="88" y="234" class="cap11">変更を検知</text>
  <path d="M328,196 V252" class="arrow"/>
  <text x="320" y="220" class="cap11 end">配信 +</text>
  <text x="320" y="234" class="cap11 end">再読み込みを通知</text>

  <!-- ファイル -->
  <rect x="56" y="252" width="140" height="60" rx="8" class="node"/>
  <text x="68" y="271" class="b600">ファイル</text>
  <text x="68" y="288" class="mono11" fill="#57606A">public/style.css</text>
  <text x="68" y="302" class="mono11" fill="#57606A">app.js</text>

  <!-- ブラウザタブ -->
  <rect x="212" y="252" width="140" height="60" rx="8" class="node-browser"/>
  <text x="224" y="271" class="b600" fill="#0969DA">ブラウザタブ</text>
  <text x="224" y="288" class="cap11">Orca 内の Chromium</text>
  <text x="224" y="302" class="cap11">3000 番を表示</text>

  <!-- ブラウザ → Claude Code（下向き）、Claude Code → ファイル（上向き） -->
  <path d="M328,312 V352" class="arrow"/>
  <text x="320" y="336" class="cap11 end">注釈を送信</text>
  <path d="M80,352 V312" class="arrow"/>
  <text x="88" y="336" class="cap11">ファイルを編集</text>

  <!-- Claude Code -->
  <rect x="56" y="352" width="296" height="40" rx="8" class="node-claude"/>
  <text x="68" y="377" class="b600" fill="#9A4A2B">Claude Code <tspan class="cap" font-weight="400">　注釈を受け取り、ファイルを直す</tspan></text>

  <!-- ===== 中央の注記 ===== -->
  <text x="440" y="166" class="cap mid">ポートを分けるので</text>
  <text x="440" y="182" class="cap mid">2 つとも同時に動く</text>
  <text x="440" y="270" class="cap mid">ワークツリーは</text>
  <text x="440" y="286" class="cap mid">別フォルダなので、</text>
  <text x="440" y="302" class="cap mid">それぞれの dev</text>
  <text x="440" y="318" class="cap mid">サーバーは自分の</text>
  <text x="440" y="334" class="cap mid">フォルダにある</text>
  <text x="440" y="350" class="cap mid">ファイルを配信する</text>

  <!-- ===== 右: ワークツリー #2（Codex） ===== -->
  <rect x="512" y="108" width="328" height="300" rx="12" fill="#FFFFFF" stroke="#0969DA" stroke-width="1.5"/>
  <text x="528" y="133" class="head" fill="#0969DA">ワークツリー #2（Codex）</text>

  <!-- dev サーバー -->
  <rect x="528" y="148" width="296" height="48" rx="8" class="node"/>
  <text x="540" y="167" class="b600">dev サーバー <tspan class="mono12" font-weight="400" fill="#57606A">PORT=3001 npm run dev</tspan></text>
  <text x="540" y="186" class="mono12">→ http://localhost:3001</text>

  <!-- ファイル → dev サーバー、dev サーバー → ブラウザ -->
  <path d="M552,252 V196" class="arrow"/>
  <text x="560" y="220" class="cap11"><tspan class="mono11">fs.watch</tspan> で</text>
  <text x="560" y="234" class="cap11">変更を検知</text>
  <path d="M800,196 V252" class="arrow"/>
  <text x="792" y="220" class="cap11 end">配信 +</text>
  <text x="792" y="234" class="cap11 end">再読み込みを通知</text>

  <!-- ファイル -->
  <rect x="528" y="252" width="140" height="60" rx="8" class="node"/>
  <text x="540" y="271" class="b600">ファイル</text>
  <text x="540" y="288" class="mono11" fill="#57606A">public/style.css</text>
  <text x="540" y="302" class="mono11" fill="#57606A">app.js</text>

  <!-- ブラウザタブ -->
  <rect x="684" y="252" width="140" height="60" rx="8" class="node-browser"/>
  <text x="696" y="271" class="b600" fill="#0969DA">ブラウザタブ</text>
  <text x="696" y="288" class="cap11">Orca 内の Chromium</text>
  <text x="696" y="302" class="cap11">3001 番を表示</text>

  <!-- ブラウザ → Codex、Codex → ファイル -->
  <path d="M800,312 V352" class="arrow"/>
  <text x="792" y="336" class="cap11 end">注釈を送信</text>
  <path d="M552,352 V312" class="arrow"/>
  <text x="560" y="336" class="cap11">ファイルを編集</text>

  <!-- Codex -->
  <rect x="528" y="352" width="296" height="40" rx="8" class="node-codex"/>
  <text x="540" y="377" class="b600" fill="#0969DA">Codex <tspan class="cap" font-weight="400">　注釈を受け取り、ファイルを直す</tspan></text>
</svg>
